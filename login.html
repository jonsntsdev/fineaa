<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>finea | Redirecionando</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: #f5f7f5;
    }

    .box {
      width: min(440px, calc(100% - 32px));
      border: 1px solid #2d332d;
      border-radius: 18px;
      background: rgba(21, 23, 21, 0.96);
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.28);
    }

    .brand {
      display: inline-flex;
      width: 56px;
      height: 56px;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: rgba(53, 214, 111, 0.12);
      color: #35d66f;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 3vw, 2.2rem);
    }

    p {
      color: #9aa39a;
      line-height: 1.6;
      margin: 0 0 18px;
    }

    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      color: #09160d;
      background: linear-gradient(180deg, #37d874, #1db954);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <!-- Mantém este endereço legado apontando para a aplicação React principal. -->
  <script>
      // A instância atual do Vite roda na porta 5177 por causa de processos antigos ocupando portas anteriores.
      const target = 'http://localhost:5177/';

    // Redireciona somente quando o arquivo foi aberto fora da aplicação principal.
      if (window.location.origin !== 'http://localhost:5177') {
      window.location.replace(target);
    }
  </script>

  <main class="box">
    <div class="brand">F</div>
    <h1>Redirecionando para o app</h1>
    <p>O login e cadastro do finea estão na aplicação principal em Vite.</p>
    <a href="http://localhost:5174/">Abrir aplicação</a>
  </main>
</body>
</html>
